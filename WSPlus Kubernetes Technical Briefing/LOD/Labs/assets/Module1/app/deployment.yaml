apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-dep
  labels:
    app: sample-dep
    sample: color
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-dep
      sample: color
  template:
    metadata:
      labels:
        app: sample-dep
        sample: color
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample
          image: podinfo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CPU_REQUEST_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: sample
                  resource: requests.cpu
                  divisor: 1m
            - name: CPU_LIMIT_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: sample
                  resource: limits.cpu
                  divisor: 1m
            - name: MEMORY_REQUEST_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: sample
                  resource: requests.memory
                  divisor: "1"
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: sample
                  resource: limits.memory
                  divisor: "1"
