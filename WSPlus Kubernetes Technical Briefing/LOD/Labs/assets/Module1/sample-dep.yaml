apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-dep
  labels:
    app: sample-dep
    sample: color
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-dep
      sample: color
  template:
    metadata:
      labels:
        app: sample-dep
        sample: color
    spec:
      containers:
        - name: sample
          image: k8slab/podip:1.0
          ports:
            - containerPort: 80
