apiVersion: v1
kind: PersistentVolume
metadata:
  name: azurefile-pv
  labels:
    storage-provider: azurefile-pvc
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    readOnly: false
    # volumeHandle format: {resource-group}#{account-name}#{share-name}
    volumeHandle: unique-volume-id
    volumeAttributes:
      resourceGroup: <resource-group>
      shareName: <share-name>
    nodeStageSecretRef:
      name: azure-secret
      namespace: default
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=0
    - gid=0
    - mfsymlinks
    - cache=strict
    - nosharesock
