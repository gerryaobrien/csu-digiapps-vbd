apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
      volumeMounts:
        - name: data
          mountPath: /sharedfolder
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: azurefile-pvc
