apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secret
spec:
  provider: azure
  secretObjects:
    - secretName: k8s-secret
      type: Opaque
      data:
        - objectName: MySecret
          key: MySecret
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    userAssignedIdentityID: ""
    clientID: "<client-id>"
    keyvaultName: "<key-vault-name>"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: MySecret
          objectType: secret
          objectVersion: ""
    tenantId: "<tenant-id>"
